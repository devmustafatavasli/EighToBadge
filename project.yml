name: EighToBadge

options:
  bundleIdPrefix: com.devmustafatavasli
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  knownRegions:
    - en
    - Base

packages:
  EighToBadgeCore:
    path: EighToBadgeCore

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: WX8U7ZR7K8
    CODE_SIGN_STYLE: Automatic

targets:

  # ── iOS primary target ────────────────────────────────────────────────────
  EighToBadge:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: EighToBadge
        excludes:
          - "**/*.entitlements"
          - "**/*.plist"
    resources:
      - path: EighToBadge/Resources/Assets.xcassets
      - path: EighToBadge/PrivacyInfo.xcprivacy
    dependencies:
      - package: EighToBadgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devmustafatavasli.eightobadge
        INFOPLIST_FILE: EighToBadge/Info.plist
        CODE_SIGN_ENTITLEMENTS: EighToBadge/EighToBadge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_TEAM: WX8U7ZR7K8
        CODE_SIGN_STYLE: Automatic

  # ── watchOS target ────────────────────────────────────────────────────────
  EighToBadgeWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: EighToBadgeWatch
        excludes:
          - "**/*.plist"
    resources:
      - path: EighToBadgeWatch/Resources/Assets.xcassets
      - path: EighToBadgeWatch/PrivacyInfo.xcprivacy
    dependencies:
      - package: EighToBadgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devmustafatavasli.eightobadge.watchkitapp
        INFOPLIST_FILE: EighToBadgeWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: WX8U7ZR7K8
        CODE_SIGN_STYLE: Automatic

schemes:
  EighToBadge:
    build:
      targets:
        EighToBadge: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  EighToBadgeWatch:
    build:
      targets:
        EighToBadgeWatch: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
